<!-- Paste into a WordPress "Custom HTML" block. Embeds the live Symmetry Stroller app (https://chaimgoodmanstrauss.com/symmetrystroller/). -->
<div id="cgs-stroller">
  <iframe src="https://chaimgoodmanstrauss.com/symmetrystroller/"
          title="Symmetry Stroller"
          allow="geolocation; clipboard-write; fullscreen"
          allowfullscreen
          loading="lazy"></iframe>
  <a class="open" href="https://chaimgoodmanstrauss.com/symmetrystroller/" target="_blank" rel="noopener">Open full screen ↗</a>
</div>
<style>
#cgs-stroller{position:relative;width:100%;margin:1rem 0;font-family:system-ui,sans-serif}
#cgs-stroller iframe{display:block;width:100%;height:80vh;min-height:520px;max-height:900px;border:1px solid #ddd;border-radius:8px;background:#fff}
#cgs-stroller .open{display:inline-block;margin-top:.4rem;font-size:.9rem;color:#2a5db0;text-decoration:none}
#cgs-stroller .open:hover{text-decoration:underline}
@media(prefers-color-scheme:dark){#cgs-stroller iframe{border-color:#3a3a3c}#cgs-stroller .open{color:#7ab0ff}}
@media(max-width:600px){#cgs-stroller iframe{height:75vh;min-height:420px;border-radius:0}}
</style>
