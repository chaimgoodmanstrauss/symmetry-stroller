<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 1rem;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        h1 {
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.5rem 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        main {
            flex: 1;
            display: flex;
        }
        #map {
            flex: 1;
        }
        .custom-pin-popup img {
            max-width: 150px;
            max-height: 150px;
            display: block;
            margin: 0 auto;
        }
        .photo-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }
        #status {
            padding: 0.5rem;
            margin-left: 1rem;
            color: #666;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-label {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #2196F3;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .file-upload-label:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>
    <header>
        <h1>Photo Map</h1>
        <div class="controls">
            <label class="file-upload-label">
                Select Photos
                <input type="file" id="photoInput" accept="image/*" multiple>
            </label>
            <button id="saveBtn">Save Map</button>
            <button id="loadBtn">Load Map</button>
            <span id="status">Ready</span>
        </div>
    </header>
    <main>
        <div id="map"></div>
    </main>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>

    <script type="module">
        import { MapHandler } from './mapHandler.js';
        import { FileHandler } from './fileHandler.js';
        import { StorageHandler } from './storageHandler.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const mapHandler = new MapHandler('map');
            const fileHandler = new FileHandler();
            const storageHandler = new StorageHandler();
            
            const statusEl = document.getElementById('status');
            const updateStatus = (message) => {
                statusEl.textContent = message;
                setTimeout(() => {
                    statusEl.textContent = 'Ready';
                }, 3000);
            };
            
            // Handle photo selection
            document.getElementById('photoInput').addEventListener('change', async (event) => {
                if (event.target.files.length === 0) return;
                
                updateStatus(`Processing ${event.target.files.length} photos...`);
                
                try {
                    const photoData = await fileHandler.processFiles(event.target.files);
                    
                    photoData.forEach(photo => {
                        if (photo.lat && photo.lng) {
                            mapHandler.addPhotoMarker(photo);
                        }
                    });
                    
                    updateStatus(`Added ${photoData.length} photos to map`);
                } catch (error) {
                    console.error('Error processing photos:', error);
                    updateStatus('Error processing photos');
                }
            });
            
            // Handle save
            document.getElementById('saveBtn').addEventListener('click', () => {
                const mapData = mapHandler.getMapData();
                storageHandler.saveMapData(mapData);
                updateStatus('Map saved');
            });
            
            // Handle load
            document.getElementById('loadBtn').addEventListener('click', () => {
                const mapData = storageHandler.loadMapData();
                if (mapData) {
                    mapHandler.clearMap();
                    mapHandler.loadMapData(mapData);
                    updateStatus('Map loaded');
                } else {
                    updateStatus('No saved map found');
                }
            });
        });
    </script>
</body>
</html>
