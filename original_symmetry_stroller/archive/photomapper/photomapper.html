<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Photo Map with 400x400 Thumbnails</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            display: flex;
            height: 100%;
            width: 100%;
        }
        #sidebar {
            width: 300px;
            padding: 20px;
            background-color: #f5f5f5;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
            flex-shrink: 0;
        }
        #map-container {
            flex: 1;
            position: relative;
            height: 100%;
            min-height: 300px;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .thumbnail {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 3px;
        }
        .photo-item {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .photo-item:hover {
            background-color: #f0f0f0;
        }
        .custom-pin .leaflet-popup-content-wrapper {
            padding: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        .custom-pin img {
            width: 400px;
            height: 400px;
            object-fit: cover;
        }
        .dropzone {
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .dropzone:hover {
            border-color: #aaa;
            background-color: #f9f9f9;
        }
        #file-input {
            display: none;
        }
        .error {
            color: #d9534f;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .success {
            color: #5cb85c;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .photo-info {
            margin-left: 10px;
            display: inline-block;
            vertical-align: top;
        }
        .photo-info p {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .photo-info small {
            color: #666;
        }
        .map-controls {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.save {
            background-color: #2196F3;
        }
        button.save:hover {
            background-color: #0b7dda;
        }
        button.load {
            background-color: #ff9800;
        }
        button.load:hover {
            background-color: #e68a00;
        }
        button.danger {
            background-color: #f44336;
        }
        button.danger:hover {
            background-color: #d32f2f;
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #666;
        }
        .divider {
            margin: 20px 0;
            border-top: 1px solid #ddd;
        }
        #load-input {
            display: none;
        }
        .file-size-info {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        .checkbox-container {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        .checkbox-container input {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h2>Photo Map</h2>
            <p>Upload photos with geolocation data to see them on the map.</p>
            
            <div class="dropzone" id="dropzone">
                <label for="file-input">
                    Click to select photos or folders<br>
                    or drop them here
                </label>
                <input type="file" id="file-input" accept="image/*" multiple webkitdirectory directory>
            </div>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>
            
            <div class="map-controls">
                <button id="fit-all">Show All Photos</button>
                <button id="clear-all" class="danger">Clear All</button>
            </div>
            
            <div class="divider"></div>
            
            <h3>Save & Load</h3>
            <div class="map-controls">
                <button id="save-state" class="save">Save Current State</button>
                <button id="load-state" class="load">Load Saved State</button>
                <input type="file" id="load-input" accept="application/json">
            </div>
            <div class="file-size-info">
                High resolution thumbnails (400x400) are saved in the JSON file.
            </div>
            
            <div class="status" id="status">Map is loading...</div>
            
            <div class="divider"></div>
            
            <h3>Uploaded Photos</h3>
            <div id="photo-list"></div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // Wait for full DOM content to be loaded
        document.addEventListener('DOMContentLoaded', () => {
            const statusElement = document.getElementById('status');
            statusElement.textContent = 'Initializing map...';
            
            // Initialize map with OpenStreetMap tiles
            let map;
            
            // Delay map initialization slightly to ensure container is ready
            setTimeout(() => {
                try {
                    // Create a minimal, light style map
                    map = L.map('map', {
                        zoomControl: true,
                        attributionControl: false
                    }).setView([40.7404, -73.9909], 15);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19
                    }).addTo(map);
                    
                    // Force a resize after map is initialized
                    setTimeout(() => {
                        window.dispatchEvent(new Event('resize'));
                        statusElement.textContent = 'Map loaded successfully. Ready for photos.';
                    }, 500);
                    
                    initApp(map);
                } catch (error) {
                    console.error('Error initializing map:', error);
                    statusElement.textContent = 'Error loading map. Please check console for details.';
                }
            }, 100);
        });
        
        function initApp(map) {
            const photoList = document.getElementById('photo-list');
            const fileInput = document.getElementById('file-input');
            const loadInput = document.getElementById('load-input');
            const dropzone = document.getElementById('dropzone');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const fitAllButton = document.getElementById('fit-all');
            const clearAllButton = document.getElementById('clear-all');
            const saveStateButton = document.getElementById('save-state');
            const loadStateButton = document.getElementById('load-state');
            const statusElement = document.getElementById('status');
            
            // Store markers and photo data for fit-to-bounds functionality and saving
            const markers = [];
            const photoData = [];
            
            // Add event listeners for file selection
            fileInput.addEventListener('change', handleFiles);
            
            // Drag and drop functionality
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.style.borderColor = '#66afe9';
                dropzone.style.backgroundColor = '#f0f7ff';
            });
            
            dropzone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropzone.style.borderColor = '#ccc';
                dropzone.style.backgroundColor = '';
            });
            
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.style.borderColor = '#ccc';
                dropzone.style.backgroundColor = '';
                const files = e.dataTransfer.files;
                handleFiles({ target: { files } });
            });
            
            dropzone.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Fit all markers on screen
            fitAllButton.addEventListener('click', () => {
                if (markers.length > 0) {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds(), { padding: [50, 50] });
                    statusElement.textContent = 'Showing all photos on map.';
                } else {
                    statusElement.textContent = 'No photos with geolocation data available.';
                }
            });
            
            // Clear all photos
            clearAllButton.addEventListener('click', () => {
                clearAllData();
                statusElement.textContent = 'All photos cleared. Ready for new uploads.';
            });
            
            // Save current state
            saveStateButton.addEventListener('click', saveState);

            // Load saved state
            loadStateButton.addEventListener('click', () => {
                loadInput.click();
            });
            
            loadInput.addEventListener('change', loadState);
            
            function clearAllData() {
                // Clear markers from map
                markers.forEach(marker => map.removeLayer(marker));
                markers.length = 0;
                
                // Clear photo data array
                photoData.length = 0;
                
                // Clear photo list
                photoList.innerHTML = '';
                
                // Clear messages
                errorMessage.textContent = '';
                successMessage.textContent = '';
                
                // Reset view
                map.setView([40.7404, -73.9909], 15, {
                    animate: false
                });
            }
            
            // Function to create a thumbnail from an image
            function createThumbnail(src, maxSize = 400) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            // Calculate thumbnail dimensions while maintaining aspect ratio
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > height) {
                                if (width > maxSize) {
                                    height = Math.round(height * maxSize / width);
                                    width = maxSize;
                                }
                            } else {
                                if (height > maxSize) {
                                    width = Math.round(width * maxSize / height);
                                    height = maxSize;
                                }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            
                            // Draw the image on the canvas
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            // Get the data URL from the canvas - higher quality for 400x400
                            const thumbnailDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                            resolve(thumbnailDataUrl);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    img.onerror = function() {
                        reject(new Error('Failed to load image'));
                    };
                    img.src = src;
                });
            }
            
            async function saveState() {
                if (photoData.length === 0) {
                    statusElement.textContent = 'No photos to save.';
                    return;
                }
                
                try {
                    statusElement.textContent = 'Creating thumbnails and preparing save file...';
                    
                    // Create thumbnails version of the photo data
                    const thumbnailPhotoData = await Promise.all(photoData.map(async (photo) => {
                        // Create thumbnail from the original image with higher resolution (200px)
                        const thumbnailSrc = await createThumbnail(photo.src, 200);
                        
                        return {
                            thumbnailSrc: thumbnailSrc,
                            filename: photo.filename,
                            lat: photo.lat,
                            lng: photo.lng
                        };
                    }));
                    
                    // Create save data object
                    const saveData = {
                        photos: thumbnailPhotoData,
                        mapCenter: map.getCenter(),
                        mapZoom: map.getZoom(),
                        version: '1.0',
                        savedAt: new Date().toISOString()
                    };
                    
                    // Convert to JSON
                    const saveJson = JSON.stringify(saveData);
                    
                    // Calculate size in KB
                    const saveSize = Math.round(saveJson.length / 1024);
                    
                    // Create blob and download link
                    const blob = new Blob([saveJson], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'photo-map-' + new Date().toISOString().slice(0, 10) + '.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    successMessage.textContent = `Saved ${photoData.length} photos to file (${saveSize} KB).`;
                    statusElement.textContent = 'Current state saved successfully with 400x400 thumbnails.';
                } catch (error) {
                    console.error('Error saving state:', error);
                    errorMessage.textContent = 'Failed to save state. See console for details.';
                }
            }
            
            function loadState(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    try {
                        const saveData = JSON.parse(e.target.result);
                        
                        // Check if the save file is valid
                        if (!saveData.photos || !Array.isArray(saveData.photos)) {
                            throw new Error('Invalid save file format');
                        }
                        
                        // Clear current state
                        clearAllData();
                        
                        // Restore map position if available
                        if (saveData.mapCenter && saveData.mapZoom) {
                            map.setView([saveData.mapCenter.lat, saveData.mapCenter.lng], saveData.mapZoom);
                        }
                        
                        // Load photos
                        const photos = saveData.photos;
                        statusElement.textContent = `Loading ${photos.length} photos...`;
                        
                        // Add photos to map
                        let loadedCount = 0;
                        photos.forEach(photo => {
                            const src = photo.thumbnailSrc || photo.src; // Support both new and old format
                            addSavedPhotoToMap({
                                src: src,
                                filename: photo.filename,
                                lat: photo.lat,
                                lng: photo.lng
                            });
                            loadedCount++;
                        });
                        
                        const fileSize = Math.round(e.target.result.length / 1024);
                        successMessage.textContent = `Loaded ${loadedCount} photos from save file (${fileSize} KB).`;
                        statusElement.textContent = 'Save file loaded successfully.';
                        
                        // Fit all photos on screen if we have any
                        if (markers.length > 0) {
                            const group = L.featureGroup(markers);
                            map.fitBounds(group.getBounds(), { padding: [50, 50] });
                        }
                    } catch (error) {
                        console.error('Error loading state:', error);
                        errorMessage.textContent = 'Failed to load state. The file might be corrupted.';
                    }
                };
                
                reader.readAsText(file);
                
                // Reset file input
                event.target.value = '';
            }
            
            function addSavedPhotoToMap(photo) {
                // Add to photo data array
                photoData.push(photo);
                
                // Create sidebar item
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const thumbnail = document.createElement('img');
                thumbnail.src = photo.src;
                thumbnail.className = 'thumbnail';
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'photo-info';
                
                const photoName = document.createElement('p');
                photoName.textContent = photo.filename;
                
                const coords = document.createElement('small');
                coords.textContent = `${photo.lat.toFixed(6)}, ${photo.lng.toFixed(6)}`;
                
                infoDiv.appendChild(photoName);
                infoDiv.appendChild(coords);
                
                photoItem.appendChild(thumbnail);
                photoItem.appendChild(infoDiv);
                photoList.appendChild(photoItem);
                
                // Create custom icon with the image thumbnail
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<img src="${photo.src}" style="width:50px;height:50px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);object-fit:cover;" />`,
                    iconSize: [50, 50],
                    iconAnchor: [25, 25]
                });
                
                // Add marker to map
                const marker = L.marker([photo.lat, photo.lng], { icon: customIcon }).addTo(map);
                markers.push(marker);
                
                // Add popup with image
                marker.bindPopup(`
                    <div class="custom-pin">
                        <img src="${photo.src}" />
                        <div style="padding:10px">
                            <strong>${photo.filename}</strong><br>
                            <small>${photo.lat.toFixed(6)}, ${photo.lng.toFixed(6)}</small>
                        </div>
                    </div>
                `, { maxWidth: 450 });
                
                // Link sidebar item to map marker
                photoItem.addEventListener('click', () => {
                    map.setView([photo.lat, photo.lng], 16);
                    marker.openPopup();
                });
                
                // Add hover effect between marker and sidebar
                photoItem.addEventListener('mouseenter', () => {
                    marker.setZIndexOffset(1000); // Bring to front
                    if (marker._icon) {
                        marker._icon.style.transform = marker._icon.style.transform.replace('translate3d', 'scale(1.2) translate3d');
                    }
                });
                
                photoItem.addEventListener('mouseleave', () => {
                    marker.setZIndexOffset(0);
                    if (marker._icon) {
                        marker._icon.style.transform = marker._icon.style.transform.replace('scale(1.2) translate3d', 'translate3d');
                    }
                });
                
                return marker;
            }

            function handleFiles(event) {
                const files = event.target.files;
                errorMessage.textContent = '';
                successMessage.textContent = '';
                
                if (files.length === 0) return;
                
                statusElement.textContent = `Processing ${files.length} photos...`;
                
                let successCount = 0;
                let errorCount = 0;
                let processedCount = 0;
                
                // Process files from directory input
                const imagesToProcess = Array.from(files).filter(file => file.type.startsWith('image/'));
                
                if (imagesToProcess.length === 0) {
                    statusElement.textContent = 'No image files found in the selected folder(s).';
                    return;
                }
                
                statusElement.textContent = `Processing ${imagesToProcess.length} images from folder(s)...`;
                
                imagesToProcess.forEach(file => {
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        
                        img.onload = () => {
                            // Read EXIF data to get geolocation
                            EXIF.getData(img, function() {
                                let lat = null;
                                let lng = null;
                                
                                if (EXIF.getTag(this, 'GPSLatitude') && EXIF.getTag(this, 'GPSLongitude')) {
                                    lat = convertDMSToDD(EXIF.getTag(this, 'GPSLatitude'), EXIF.getTag(this, 'GPSLatitudeRef'));
                                    lng = convertDMSToDD(EXIF.getTag(this, 'GPSLongitude'), EXIF.getTag(this, 'GPSLongitudeRef'));
                                }
                                
                                if (lat && lng) {
                                    addPhotoToMap(img.src, file.name, lat, lng);
                                    successCount++;
                                } else {
                                    errorCount++;
                                    console.log(`No geolocation data found in ${file.name}`);
                                }
                                
                                processedCount++;
                                updateProgress();
                            });
                        };
                    };
                    
                    reader.readAsDataURL(file);
                });
                
                function updateProgress() {
                    if (processedCount === imagesToProcess.length) {
                        if (errorCount > 0 && successCount > 0) {
                            statusElement.textContent = `Processed ${successCount} photos successfully. ${errorCount} photos had no geolocation data.`;
                            errorMessage.textContent = `${errorCount} photos had no geolocation data.`;
                            
                            // Fit all markers on screen
                            const group = L.featureGroup(markers);
                            map.fitBounds(group.getBounds(), { padding: [50, 50] });
                        } else if (errorCount > 0 && successCount === 0) {
                            statusElement.textContent = 'No photos with geolocation data were found.';
                            errorMessage.textContent = `None of the ${errorCount} photos contained geolocation data.`;
                        } else if (successCount > 0) {
                            statusElement.textContent = `Successfully added ${successCount} photos to the map.`;
                            successMessage.textContent = `Added ${successCount} photos to the map.`;
                            
                            // Fit all markers on screen
                            const group = L.featureGroup(markers);
                            map.fitBounds(group.getBounds(), { padding: [50, 50] });
                        }
                    }
                }
                
                // Reset file input
                event.target.value = '';
            }

            function convertDMSToDD(dms, ref) {
                const degrees = dms[0];
                const minutes = dms[1];
                const seconds = dms[2];
                
                let dd = degrees + minutes/60 + seconds/3600;
                
                if (ref === 'S' || ref === 'W') {
                    dd = -dd;
                }
                
                return dd;
            }

            function addPhotoToMap(src, filename, lat, lng) {
                // Create photo data object for saving
                const photo = {
                    src: src,
                    filename: filename,
                    lat: lat,
                    lng: lng
                };
                
                // Add to photo data array
                photoData.push(photo);
                
                // Create sidebar item
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                const thumbnail = document.createElement('img');
                thumbnail.src = src;
                thumbnail.className = 'thumbnail';
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'photo-info';
                
                const photoName = document.createElement('p');
                photoName.textContent = filename;
                
                const coords = document.createElement('small');
                coords.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                
                infoDiv.appendChild(photoName);
                infoDiv.appendChild(coords);
                
                photoItem.appendChild(thumbnail);
                photoItem.appendChild(infoDiv);
                photoList.appendChild(photoItem);
                
                // Create custom icon with the image thumbnail
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<img src="${src}" style="width:50px;height:50px;border-radius:50%;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.5);object-fit:cover;" />`,
                    iconSize: [50, 50],
                    iconAnchor: [25, 25]
                });
                
                // Add marker to map
                const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                markers.push(marker);
                
                // Add popup with larger image
                marker.bindPopup(`
                    <div class="custom-pin">
                        <img src="${src}" />
                        <div style="padding:10px">
                            <strong>${filename}</strong><br>
                            <small>${lat.toFixed(6)}, ${lng.toFixed(6)}</small>
                        </div>
                    </div>
                `, { maxWidth: 450 });
                
                // Link sidebar item to map marker
                photoItem.addEventListener('click', () => {
                    map.setView([photo.lat, photo.lng], 16);
                    marker.openPopup();
                });
                
                // Add hover effect between marker and sidebar
                photoItem.addEventListener('mouseenter', () => {
                    marker.setZIndexOffset(1000); // Bring to front
                    if (marker._icon) {
                        marker._icon.style.transform = marker._icon.style.transform.replace('translate3d', 'scale(1.2) translate3d');
                    }
                });
                
                photoItem.addEventListener('mouseleave', () => {
                    marker.setZIndexOffset(0);
                    if (marker._icon) {
                        marker._icon.style.transform = marker._icon.style.transform.replace('scale(1.2) translate3d', 'translate3d');
                    }
                });
            }
        }
    </script>
    
    <!-- Load EXIF.js for reading geolocation data from images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
</body>
</html>
