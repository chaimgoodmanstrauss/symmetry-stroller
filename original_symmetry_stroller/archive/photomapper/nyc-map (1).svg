<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f8f8"/>
  
  <!-- Avenues (vertical streets) - Adjusted for more accurate spacing -->
  <line x1="125" y1="50" x2="125" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="225" y1="50" x2="225" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="325" y1="50" x2="325" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="425" y1="50" x2="425" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="525" y1="50" x2="525" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="625" y1="50" x2="625" y2="550" stroke="#888" stroke-width="8"/>
  <line x1="715" y1="50" x2="715" y2="550" stroke="#888" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- Avenue Labels - Positioned to be fully visible -->
  <text x="125" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">6th Ave</text>
  <text x="225" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">5th Ave</text>
  <text x="325" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Madison</text>
  <text x="425" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Park Ave</text>
  <text x="525" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Lexington</text>
  <text x="625" y="40" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">3rd Ave</text>
  <text x="715" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Broadway</text>
  
  <!-- Streets (horizontal) - More accurately spaced -->
  <line x1="50" y1="100" x2="750" y2="100" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="130" x2="750" y2="130" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="160" x2="750" y2="160" stroke="#aaa" stroke-width="6"/>
  <line x1="50" y1="190" x2="750" y2="190" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="220" x2="750" y2="220" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="250" x2="750" y2="250" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="280" x2="750" y2="280" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="310" x2="750" y2="310" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="340" x2="750" y2="340" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="370" x2="750" y2="370" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="400" x2="750" y2="400" stroke="#aaa" stroke-width="6"/>
  <line x1="50" y1="430" x2="750" y2="430" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="460" x2="750" y2="460" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="490" x2="750" y2="490" stroke="#aaa" stroke-width="4"/>
  <line x1="50" y1="520" x2="750" y2="520" stroke="#aaa" stroke-width="4"/>
  
  <!-- Street Labels - Positioned to ensure visibility -->
  <text x="45" y="100" text-anchor="end" font-family="Arial" font-size="14">12th St</text>
  <text x="45" y="130" text-anchor="end" font-family="Arial" font-size="14">13th St</text>
  <text x="45" y="160" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">14th St</text>
  <text x="45" y="190" text-anchor="end" font-family="Arial" font-size="14">15th St</text>
  <text x="45" y="220" text-anchor="end" font-family="Arial" font-size="14">16th St</text>
  <text x="45" y="250" text-anchor="end" font-family="Arial" font-size="14">17th St</text>
  <text x="45" y="280" text-anchor="end" font-family="Arial" font-size="14">18th St</text>
  <text x="45" y="310" text-anchor="end" font-family="Arial" font-size="14">19th St</text>
  <text x="45" y="340" text-anchor="end" font-family="Arial" font-size="14">20th St</text>
  <text x="45" y="370" text-anchor="end" font-family="Arial" font-size="14">21st St</text>
  <text x="45" y="400" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold">23rd St</text>
  <text x="45" y="430" text-anchor="end" font-family="Arial" font-size="14">24th St</text>
  <text x="45" y="460" text-anchor="end" font-family="Arial" font-size="14">25th St</text>
  <text x="45" y="490" text-anchor="end" font-family="Arial" font-size="14">26th St</text>
  <text x="45" y="520" text-anchor="end" font-family="Arial" font-size="14">27th St</text>
  
  <!-- Broadway (diagonal street) -->
  <line x1="225" y1="100" x2="715" y2="520" stroke="#888" stroke-width="6" stroke-dasharray="10,5"/>
  
  <!-- Parks with more accurate locations -->
  <!-- Union Square (between 14th-17th Streets, 4th Ave/Park Ave S and Broadway) -->
  <polygon points="425,145 425,250 225,250 245,145" fill="#90EE90" stroke="#006400" stroke-width="2"/>
  <text x="325" y="190" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#006400">Union Square</text>
  <text x="325" y="215" text-anchor="middle" font-family="Arial" font-size="14" fill="#006400">(14th-17th St)</text>
  
  <!-- Madison Square Park (between 23rd-26th Streets, 5th Ave and Madison Ave) -->
  <rect x="225" y="400" width="100" height="90" fill="#90EE90" stroke="#006400" stroke-width="2"/>
  <text x="275" y="435" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#006400">Madison</text>
  <text x="275" y="455" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#006400">Square Park</text>
  <text x="275" y="475" text-anchor="middle" font-family="Arial" font-size="12" fill="#006400">(23rd-26th St)</text>
  
  <!-- Gramercy Park (private park between 20th-21st Streets) -->
  <rect x="325" y="340" width="60" height="30" fill="#90EE90" stroke="#006400" stroke-width="2"/>
  <text x="355" y="360" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#006400">Gramercy Park</text>
  
  <!-- Stuyvesant Square (between 15th-17th Streets, east of 2nd Ave) -->
  <rect x="625" y="190" width="70" height="60" fill="#90EE90" stroke="#006400" stroke-width="2"/>
  <text x="660" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#006400">Stuyvesant</text>
  <text x="660" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#006400">Square</text>
  
  <!-- North indicator -->
  <polygon points="750,60 765,30 780,60" fill="#333"/>
  <text x="765" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">N</text>
  
  <!-- Note about accuracy -->
  <text x="400" y="575" text-anchor="middle" font-family="Arial" font-size="14" font-style="italic">Note: Map is approximate and not to scale</text>
  
  <!-- Title -->
  <text x="400" y="605" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">NYC Streets and Parks: 6th to 3rd Ave, 12th to 27th St</text>
</svg>