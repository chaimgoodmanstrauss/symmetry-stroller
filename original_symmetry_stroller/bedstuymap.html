<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Map - Fulton Park</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .grayscale-base {
            filter: grayscale(1) brightness(0.85);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const FULTON_PARK = [40.6807, -73.9157];
        
        const map = L.map('map', {
            zoomControl: true,
            maxZoom: 21
        }).setView(FULTON_PARK, 16);
        
        // Grayscale base layer (no labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
            maxZoom: 21,
            maxNativeZoom: 19,
            className: 'light_nolabels'
        }).addTo(map);
        
        // Bold labels on top (Voyager has the darkest labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 21,
            maxNativeZoom: 19
        }).addTo(map);
    </script>
</body>
</html>
