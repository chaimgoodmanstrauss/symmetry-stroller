<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Walker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        /* EB Garamond, self-hosted (open-source alternative to Adobe
           Garamond Pro) so the title renders correctly offline. */
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('fonts/EBGaramond-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('fonts/EBGaramond-600.woff2') format('woff2');
        }
        @font-face {
            font-family: 'EB Garamond';
            font-style: italic;
            font-weight: 500;
            font-display: swap;
            src: url('fonts/EBGaramond-500-Italic.woff2') format('woff2');
        }
    </style>
    <style>
        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --text: #16181d;
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --radius: 10px;
            --radius-sm: 7px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
            --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.12);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        #title-image {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: 40vw;
            z-index: 1000;
            opacity: 0.92;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: none;
            text-align: right;
            font-family: 'EB Garamond', 'Garamond', 'Georgia', serif;
            color: #4a1030;
            /* Layered soft white glow (a "shadow" the opposite color of the
               text) so the title reads over any map tile underneath it,
               rather than a conventional dark drop shadow. */
            text-shadow:
                0 0 4px #fff,
                0 0 12px #fff,
                0 0 28px rgba(255, 255, 255, 0.9),
                0 4px 36px rgba(255, 255, 255, 0.8);
        }

        #title-image:hover {
            opacity: 1;
        }

        #title-image .title-main {
            display: block;
            font-weight: 600;
            font-size: clamp(28px, 4vw, 56px);
            line-height: 1.05;
            letter-spacing: 0.01em;
        }

        #title-image .title-walk {
            display: block;
            font-style: italic;
            font-weight: 500;
            font-size: clamp(26px, 3.8vw, 54px);
            margin-top: 0.15em;
            opacity: 0.85;
        }

        /* Mode-specific visibility */
        .stroller-mode .maker-only {
            display: none !important;
        }

        .stroller-mode #sidebar {
            display: none !important;
        }

        .stroller-mode #map-container {
            width: 100vw !important;
        }

        .stroller-mode .delete-button,
        .stroller-mode .control-point {
            display: none !important;
        }

        /* Mode selector */
        .mode-selector {
            display: flex;
            background: var(--bg);
            border-radius: 999px;
            padding: 3px;
            border: 1px solid var(--border);
        }

        .mode-option {
            position: relative;
            flex: 1;
        }

        .mode-option input[type="radio"] {
            opacity: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer;
        }

        .mode-option label {
            display: block;
            padding: 6px 14px;
            text-align: center;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .mode-option input[type="radio"]:checked + label {
            background: var(--accent);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .mode-option:last-child input[type="radio"]:checked + label {
            background: var(--text);
        }

        /* Sidebar */
        #sidebar {
            width: 300px;
            padding: 22px 20px;
            background-color: var(--surface);
            overflow-y: auto;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        #sidebar h2 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0;
        }

        #sidebar h3 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 12px;
        }

        #app-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        #map-container {
            flex: 1;
            position: relative;
            height: 100%;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* UI Elements */
        .thumbnail {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .photo-item {
            position: relative;
            margin-bottom: 8px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--surface);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .photo-item:hover {
            background-color: var(--bg);
            border-color: var(--border-strong);
        }

        .dropzone {
            border: 1.5px dashed var(--border-strong);
            border-radius: var(--radius);
            padding: 22px;
            text-align: center;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            color: var(--text-muted);
        }

        .dropzone:hover {
            border-color: var(--accent);
            background-color: #f5f4ff;
            color: var(--accent);
        }

        #file-input, #load-input {
            display: none;
        }

        .error {
            color: var(--danger);
            margin: 10px 0;
            font-size: 13px;
        }

        .success {
            color: var(--success);
            margin: 10px 0;
            font-size: 13px;
        }

        .photo-info {
            margin-left: 10px;
            display: inline-block;
            vertical-align: top;
        }

        .photo-info p {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 175px;
        }

        .photo-info small {
            color: var(--text-muted);
            font-size: 11.5px;
        }

        .map-controls {
            margin: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 8px 13px;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        button:hover {
            background-color: var(--bg);
            border-color: var(--border-strong);
        }

        button.save {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        button.save:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        button.danger {
            background-color: var(--surface);
            color: var(--danger);
            border-color: #fecaca;
        }

        button.danger:hover {
            background-color: #fef2f2;
            border-color: var(--danger);
        }

        .status {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .divider {
            margin: 20px 0;
            border-top: 1px solid var(--border);
        }

        /* Delete buttons */
        .delete-button, .photo-delete-button {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--surface);
            color: var(--danger);
            border: 1.5px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
            line-height: 0;
        }

        .delete-button {
            top: -6px;
            right: -6px;
            z-index: 1000;
        }

        .photo-delete-button {
            top: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            font-size: 17px;
        }

        .delete-button:hover, .photo-delete-button:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* Control point */
        .control-point {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(79, 70, 229, 0.2);
            border: 1.5px solid var(--accent);
            cursor: pointer;
            z-index: 1001;
            transition: background-color 0.2s;
        }

        .control-point:hover {
            background-color: rgba(79, 70, 229, 0.4);
        }

        /* Marker styles */
        .custom-marker {
            position: relative;
        }

        .marker-container {
            position: relative;
            display: inline-block;
            transition: all 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .marker-container img {
            transition: all 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-origin: center bottom;
            border: 3px solid white;
            border-radius: 3px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .marker-triangle {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
            transition: all 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .marker-dot {
            position: absolute;
            bottom: -11px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #9aa1ab;
            z-index: 1002;
            transition: all 0.15s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(22, 24, 29, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: white;
            padding: 16px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            z-index: 3000;
            display: none;
        }

        .loading-overlay::after {
            content: '';
            animation: ellipsis 1.5s infinite;
        }

        @keyframes ellipsis {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .stroller-mode .loading-overlay {
            display: block;
        }

        .loading-overlay.hidden {
            display: none !important;
        }

    </style>
</head>
<body>
    <div id="app">
        <div id="title-image">
            <span class="title-main">Symmetry Stroll</span>
            <span class="title-walk" id="title-walk-name"></span>
        </div>
        <div class="loading-overlay" id="loading-overlay">Loading Symmetry Walk...</div>
        <div id="sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="app-title">Photo Map</h2>
                <div class="mode-selector">
                    <div class="mode-option">
                        <input type="radio" id="maker-mode" name="app-mode" value="writer">
                        <label for="maker-mode">Editor</label>
                    </div>
                    <div class="mode-option">
                        <input type="radio" id="stroller-mode" name="app-mode" value="stroller">
                        <label for="stroller-mode">Stroller</label>
                    </div>
                </div>
            </div>
            <p id="app-description">Upload photos with geolocation data to see them on the map.</p>

            <div class="maker-only" style="margin-bottom: 15px;">
                <label for="walk-name-input" style="display: block; font-size: 13px; margin-bottom: 4px; color: var(--text-muted, #666);">Gallery / walk name</label>
                <input type="text" id="walk-name-input" placeholder="e.g. Fifth Avenue" style="width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px;">
            </div>

            <div class="maker-only" style="margin-bottom: 15px;">
                <label for="walk-slug-input" style="display: block; font-size: 13px; margin-bottom: 4px; color: var(--text-muted, #666);">Slug (used for the URL and filenames)</label>
                <input type="text" id="walk-slug-input" placeholder="e.g. fifth-avenue" style="width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 14px;">
            </div>

            <div class="dropzone" id="dropzone">
                <label for="file-input">
                    Click to select photos or folders<br>
                    or drop them here
                </label>
                <input type="file" id="file-input" accept="image/*" multiple webkitdirectory directory>
            </div>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>

            <div class="map-controls">
                <button id="fit-all">Show All Photos</button>
                <button id="clear-all" class="danger maker-only">Clear Gallery</button>
            </div>

            <div class="divider maker-only"></div>

            <h3 class="maker-only">Save & Load</h3>
            <div class="map-controls maker-only">
                <button id="save-state" class="save">Export walk.json + photos</button>
                <button id="load-state" class="load">Load Saved State</button>
                <input type="file" id="load-input" accept="application/json">
            </div>

            <div class="status" id="status">Map is loading...</div>

            <div class="divider"></div>

            <h3>Uploaded Photos</h3>
            <div id="photo-list"></div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        // Configuration
        const CONFIG = {
            IS_MAKER_MODE: false, //the program has two states, which are toggled here
            DEFAULT_CENTER: [40.7420, -73.9880],
            DEFAULT_ZOOM: 13,
            MAX_ZOOM: 21,
            SQUARE_ZOOM_MAX: 17,
            FULL_ZOOM_MIN: 19,
            SQUARE_SIZE: 90,
            MARKER_DOT_OFFSET: 11,
            AUTO_LOAD_FILE: null,
            PHOTO_BASE: '',
            // Responsive sizing configuration
            MAX_MARKER_WIDTH: 500,    // Maximum width for desktop
            MAX_MARKER_HEIGHT: 550,   // Maximum height for desktop
            MOBILE_MAX_WIDTH: 320,    // Maximum width for mobile
            MOBILE_MAX_HEIGHT: 380,   // Maximum height for mobile
            MOBILE_BREAKPOINT: 768    // Width breakpoint for mobile devices
        };

        // Which walk this page instance is showing, resolved from ?walk=<slug> via walks.json
        let currentWalk = null;

        // App State
        const state = {
            map: null,
            markers: [],
            photoData: [],
            maxZIndex: 1000,
            isDragging: false,
            dragState: null,
            isMarkerDragging: false,
            markerDragState: null,
            optionKeyDown: false,
            enlargedMarker: null,
            walkName: '',
            walkSlug: '',
            walkSlugManuallySet: false
        };

        // DOM Elements
        const elements = {};

        // Initialize app
        document.addEventListener('DOMContentLoaded', initializeApp);

        async function resolveWalk() {
            const slug = new URLSearchParams(location.search).get('walk');
            if (!slug) return null;

            try {
                const res = await fetch('walks.json', { cache: 'no-store' });
                const manifest = await res.json();
                const entry = manifest.find(w => w.slug === slug);
                if (!entry) console.warn(`No walk found in walks.json for slug "${slug}"`);
                return entry || null;
            } catch (error) {
                console.error('Failed to load walks.json', error);
                return null;
            }
        }

        // Navigate to a given mode ('writer' or 'stroller') by rewriting the
        // `mode` URL param, so the address bar always reflects the current
        // mode and can be bookmarked/shared/reloaded directly.
        function navigateToMode(mode) {
            const params = new URLSearchParams(location.search);
            params.set('mode', mode);
            location.search = params.toString();
        }

        async function initializeApp() {
            // Mode is driven entirely by ?mode=writer in the URL; anything
            // else (including no param at all) is Stroller/viewer mode.
            const params = new URLSearchParams(location.search);
            CONFIG.IS_MAKER_MODE = params.get('mode') === 'writer';

            // Apply mode
            document.body.className = CONFIG.IS_MAKER_MODE ? 'maker-mode' : 'stroller-mode';

            // Resolve which walk to show/edit from the URL, via the manifest
            currentWalk = await resolveWalk();
            if (currentWalk) {
                CONFIG.AUTO_LOAD_FILE = currentWalk.dataFile;
                CONFIG.PHOTO_BASE = currentWalk.dataFile.replace(/[^/]+$/, '');
                state.walkName = currentWalk.title || '';
                state.walkSlug = currentWalk.slug || '';
                state.walkSlugManuallySet = true;
            }

            document.title = currentWalk
                ? `${currentWalk.title} — ${CONFIG.IS_MAKER_MODE ? 'Editor' : 'Stroller'}`
                : (CONFIG.IS_MAKER_MODE ? 'Symmetry Stroller — Editor' : 'Symmetry Stroller');

            // Cache DOM elements
            cacheElements();

            // Update UI
            updateUI();

            // Initialize map
            initializeMap();

            // Setup event listeners
            setupEventListeners();

            // Show the floating title
            updateTitleDisplay();
        }

        function cacheElements() {
            const ids = ['photo-list', 'file-input', 'load-input', 'dropzone', 'error-message',
                        'success-message', 'fit-all', 'clear-all', 'save-state', 'load-state',
                        'status', 'app-title', 'app-description', 'walk-name-input', 'walk-slug-input', 'title-walk-name'];

            ids.forEach(id => {
                elements[id] = document.getElementById(id);
            });
        }

        function updateUI() {
            if (CONFIG.IS_MAKER_MODE) {
                elements['app-title'].textContent = currentWalk ? `${currentWalk.title} (Editor)` : 'Symmetry Stroller — Editor';
                elements['app-description'].textContent = 'Upload photos with geolocation data to create, edit, and save photo maps.';
                document.getElementById('maker-mode').checked = true;
            } else {
                elements['app-title'].textContent = currentWalk ? currentWalk.title : 'Symmetry Stroller';
                elements['app-description'].textContent = 'Explore photos on an interactive map. Clean viewing experience.';
                document.getElementById('stroller-mode').checked = true;
            }
        }

        function initializeMap() {
            elements.status.textContent = 'Initializing map...';

            setTimeout(() => {
                try {
                    state.map = L.map('map', {
                        zoomControl: true,
                        attributionControl: false,
                        maxZoom: CONFIG.MAX_ZOOM
                    }).setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        maxZoom: CONFIG.MAX_ZOOM,
                        maxNativeZoom: 19
                    }).addTo(state.map);

                    // Add zoom event listeners
                    state.map.on('zoom zoomend', handleZoomChange);

                    elements.status.textContent = 'Map loaded successfully. Ready for photos.';

                    // Auto-load the walk named by ?walk= in either mode, so
                    // switching into writer mode (e.g. via the shortcut)
                    // starts from the gallery you were just viewing instead
                    // of an empty canvas.
                    if (CONFIG.AUTO_LOAD_FILE) {
                        setTimeout(autoLoadStrollerData, CONFIG.IS_MAKER_MODE ? 300 : 1000);
                    } else if (!CONFIG.IS_MAKER_MODE) {
                        document.getElementById('loading-overlay').classList.add('hidden');
                        elements.status.textContent = 'No walk specified. Add ?walk=<slug> to the URL (see walks.json).';
                    }

                } catch (error) {
                    console.error('Error initializing map:', error);
                    elements.status.textContent = 'Error loading map. Please check console for details.';
                }
            }, 100);
        }

        function setupEventListeners() {
            // File handling
            elements['file-input'].addEventListener('change', handleFiles);
            elements.dropzone.addEventListener('click', () => elements['file-input'].click());
            setupDragAndDrop();

            // Map controls
            elements['fit-all'].addEventListener('click', fitAllPhotos);
            elements['clear-all'].addEventListener('click', clearGallery);

            // Save/Load (Maker mode only)
            if (CONFIG.IS_MAKER_MODE) {
                elements['save-state'].addEventListener('click', saveState);
                elements['load-state'].addEventListener('click', () => elements['load-input'].click());
                elements['load-input'].addEventListener('change', loadState);
                elements['walk-name-input'].addEventListener('input', (e) => {
                    state.walkName = e.target.value;
                    elements['title-walk-name'].textContent = state.walkName;

                    if (!state.walkSlugManuallySet) {
                        state.walkSlug = slugify(state.walkName);
                        elements['walk-slug-input'].value = state.walkSlug;
                    }
                });
                elements['walk-slug-input'].addEventListener('input', (e) => {
                    state.walkSlugManuallySet = true;
                    state.walkSlug = slugify(e.target.value);
                    e.target.value = state.walkSlug;
                });
            }

            // Mode switching
            document.querySelectorAll('input[name="app-mode"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.checked && ((e.target.value === 'writer') !== CONFIG.IS_MAKER_MODE)) {
                        navigateToMode(e.target.value);
                    }
                });
            });

            // Secret keyboard shortcut. Uses e.code (physical key), not
            // e.key, because on Mac holding Option remaps e.key to a
            // special character instead of '8'.
            document.addEventListener('keydown', (e) => {
                if (e.shiftKey && (e.metaKey || e.ctrlKey) && e.altKey && e.code === 'Digit8') {
                    e.preventDefault();
                    navigateToMode(CONFIG.IS_MAKER_MODE ? 'stroller' : 'writer');
                }
            });

            // Option key handlers (Maker mode only)
            if (CONFIG.IS_MAKER_MODE) {
                setupOptionKeyHandlers();
            }

            // Map interactions
            setupMapInteractions();
            // Add map click handler for stroller mode
            if (!CONFIG.IS_MAKER_MODE) {
                state.map.on('click', () => {
                    if (state.enlargedMarker) {
                        resetEnlargedMarker();
                    }
                });
            }
        }

        function setupDragAndDrop() {
            elements.dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                elements.dropzone.style.borderColor = '#66afe9';
                elements.dropzone.style.backgroundColor = '#f0f7ff';
            });

            elements.dropzone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                elements.dropzone.style.borderColor = '#ccc';
                elements.dropzone.style.backgroundColor = '';
            });

            elements.dropzone.addEventListener('drop', async (e) => {
                e.preventDefault();
                elements.dropzone.style.borderColor = '#ccc';
                elements.dropzone.style.backgroundColor = '';
                const files = await collectFilesFromDataTransfer(e.dataTransfer);
                handleFiles({ target: { files } });
            });
        }

        // Plain dataTransfer.files only lists top-level dropped items, so a
        // dropped folder shows up empty. Walking dataTransfer.items via the
        // webkitGetAsEntry/FileSystemEntry API recurses into folders.
        async function collectFilesFromDataTransfer(dataTransfer) {
            const items = dataTransfer.items;
            if (!items || !items.length || !items[0].webkitGetAsEntry) {
                return Array.from(dataTransfer.files);
            }

            const entries = Array.from(items)
                .map(item => item.webkitGetAsEntry())
                .filter(entry => entry);

            const files = [];
            await Promise.all(entries.map(entry => walkFileEntry(entry, files)));
            return files;
        }

        function walkFileEntry(entry, files) {
            return new Promise((resolve) => {
                if (entry.isFile) {
                    entry.file(file => {
                        files.push(file);
                        resolve();
                    }, resolve);
                } else if (entry.isDirectory) {
                    const reader = entry.createReader();
                    const readNextBatch = () => {
                        reader.readEntries(async (batch) => {
                            if (batch.length === 0) {
                                resolve();
                                return;
                            }
                            await Promise.all(batch.map(sub => walkFileEntry(sub, files)));
                            readNextBatch(); // readEntries returns partial results at a time
                        }, resolve);
                    };
                    readNextBatch();
                } else {
                    resolve();
                }
            });
        }

        function setupOptionKeyHandlers() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Alt' && !state.optionKeyDown) {
                    state.optionKeyDown = true;
                    showControlPoints();
                    state.map.dragging.disable();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.key === 'Alt' && state.optionKeyDown) {
                    state.optionKeyDown = false;
                    hideControlPoints();
                    state.map.dragging.enable();
                }
            });

            window.addEventListener('blur', () => {
                if (state.optionKeyDown) {
                    state.optionKeyDown = false;
                    hideControlPoints();
                    state.map.dragging.enable();
                }
            });
        }

        function setupMapInteractions() {
            const mapEl = document.getElementById('map');

            mapEl.addEventListener('mousedown', (e) => {
                if (!CONFIG.IS_MAKER_MODE) return;

                if (e.target.classList.contains('delete-button')) {
                    return; // Let delete handle itself
                } else if (e.target.classList.contains('control-point')) {
                    e.preventDefault();
                    e.stopPropagation();
                    const markerContainer = e.target.closest('.marker-container');
                    const deleteBtn = markerContainer?.querySelector('.delete-button');
                    if (deleteBtn) {
                        const photoId = deleteBtn.getAttribute('data-photo-id');
                        const photoIndex = state.photoData.findIndex(p => p.id === photoId);
                        if (photoIndex >= 0 && state.markers[photoIndex]) {
                            startResize(e, state.markers[photoIndex]);
                        }
                    }
                } else if (!state.optionKeyDown) {
                    // Check for marker drag
                    let markerContainer = e.target.closest('.marker-container');
                    if (markerContainer) {
                        const deleteBtn = markerContainer.querySelector('.delete-button');
                        if (deleteBtn) {
                            const photoId = deleteBtn.getAttribute('data-photo-id');
                            const photoIndex = state.photoData.findIndex(p => p.id === photoId);
                            if (photoIndex >= 0 && state.markers[photoIndex]) {
                                startMarkerDrag(e, state.markers[photoIndex], photoIndex);
                            }
                        }
                    }
                }
            });

            mapEl.addEventListener('click', (e) => {
                if (!CONFIG.IS_MAKER_MODE || state.isMarkerDragging) return;

                if (e.target.classList.contains('delete-button')) {
                    e.preventDefault();
                    e.stopPropagation();
                    const photoId = e.target.getAttribute('data-photo-id');
                    const photoIndex = state.photoData.findIndex(p => p.id === photoId);
                    if (photoIndex >= 0) {
                        removePhoto(photoIndex);
                    }
                }
            }, true);
        }

        function updateTitleDisplay() {
            const titleEl = document.getElementById('title-image');
            if (!titleEl) return;

            elements['title-walk-name'].textContent = state.walkName || '';
            titleEl.style.display = 'block';

            if (elements['walk-name-input'] && document.activeElement !== elements['walk-name-input']) {
                elements['walk-name-input'].value = state.walkName || '';
            }

            if (elements['walk-slug-input'] && document.activeElement !== elements['walk-slug-input']) {
                elements['walk-slug-input'].value = state.walkSlug || '';
            }
        }

        function autoLoadStrollerData() {
            console.log('Loading Symmetry Walk data...');
            const loadingOverlay = document.getElementById('loading-overlay');

            fetch(CONFIG.AUTO_LOAD_FILE, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    clearAllData();
                    loadStateFromData(data);
                    console.log(`Loaded ${data.photos ? data.photos.length : 0} photos`);

                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        // Trust the writer's saved view if there is one;
                        // only fall back to auto-framing (which an outlier
                        // GPS point can throw off) when the file has none.
                        if (!(data.mapCenter && data.mapZoom)) {
                            fitAllPhotos();
                        }
                    }, 500);
                })
                .catch(error => {
                    console.error('Auto-load failed:', error);
                    loadingOverlay.textContent = 'Failed to load photos';
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                    }, 2000);
                });
        }

        // Helper function to check if device is mobile
        function isMobileDevice() {
            return window.innerWidth <= CONFIG.MOBILE_BREAKPOINT;
        }

        // Default short-side size for a newly placed photo, scaled with the
        // viewport so it looks reasonable on both small and large screens.
        function getDefaultMarkerBaseSize() {
            const viewportMin = Math.min(window.innerWidth, window.innerHeight);
            return Math.round(Math.max(70, Math.min(160, viewportMin * 0.12)));
        }

        // Helper function to get max dimensions based on device type
        function getMaxDimensions(isEnlarged = false) {
            if (isMobileDevice()) {
                return {
                    maxWidth: CONFIG.MOBILE_MAX_WIDTH,
                    maxHeight: CONFIG.MOBILE_MAX_HEIGHT
                };
            } else if (isEnlarged) {
                // Fill most of the browser window rather than a fixed cap,
                // so the enlarged view scales with however big the screen
                // actually is.
                return {
                    maxWidth: window.innerWidth * 0.75,
                    maxHeight: window.innerHeight * 0.75
                };
            } else {
                return {
                    maxWidth: CONFIG.MAX_MARKER_WIDTH,
                    maxHeight: CONFIG.MAX_MARKER_HEIGHT
                };
            }
        }

        // A saved photo either carries inline base64 (legacy `src`) or a path
        // relative to the walk's own data file (`photo`, new lean format).
        function resolvePhotoSrc(photo) {
            if (photo.src) return photo.src;
            if (photo.photo) return (CONFIG.PHOTO_BASE || '') + photo.photo;
            return '';
        }

        // Photo handling functions
        function handleFiles(event) {
            const files = Array.from(event.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) {
                elements.status.textContent = 'No image files found.';
                return;
            }

            elements.status.textContent = `Processing ${files.length} images...`;
            elements['error-message'].textContent = '';
            elements['success-message'].textContent = '';

            let successCount = 0;
            let errorCount = 0;
            let processedCount = 0;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = () => {
                        EXIF.getData(img, function() {
                            const gpsLat = EXIF.getTag(this, 'GPSLatitude');
                            const gpsLng = EXIF.getTag(this, 'GPSLongitude');

                            if (gpsLat && gpsLng) {
                                const lat = convertDMSToDD(gpsLat, EXIF.getTag(this, 'GPSLatitudeRef'));
                                const lng = convertDMSToDD(gpsLng, EXIF.getTag(this, 'GPSLongitudeRef'));
                                addPhotoToMap(img.src, file.name, lat, lng);
                                successCount++;
                            } else {
                                errorCount++;
                            }

                            processedCount++;
                            if (processedCount === files.length) {
                                updateFileProcessingStatus(successCount, errorCount);
                            }
                        });
                    };
                };
                reader.readAsDataURL(file);
            });

            event.target.value = '';
        }

        // Average position of a set of photos (all placed photos by
        // default). Used as the map's resting center after a drop, since
        // the bounding-box center that fitBounds uses can sit off to one
        // side when photos aren't evenly spread along the route.
        function calculatePhotoCentroid(photos = state.photoData) {
            if (photos.length === 0) return null;

            const total = photos.reduce((acc, p) => {
                acc.lat += p.lat;
                acc.lng += p.lng;
                return acc;
            }, { lat: 0, lng: 0 });

            return {
                lat: total.lat / photos.length,
                lng: total.lng / photos.length
            };
        }

        function median(sortedNumbers) {
            const n = sortedNumbers.length;
            if (n === 0) return 0;
            const mid = Math.floor(n / 2);
            return n % 2 !== 0 ? sortedNumbers[mid] : (sortedNumbers[mid - 1] + sortedNumbers[mid]) / 2;
        }

        function haversineMeters(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Drops photos whose position is a dramatic outlier (e.g. a bad GPS
        // fix miles from the rest of the walk) before that photo gets a say
        // in zoom/centering. Outliers are still shown on the map — this only
        // controls what "fit everything nicely in frame" considers "everything".
        function filterPositionOutliers(photos) {
            if (photos.length < 4) return photos; // too few points to judge

            const medianLat = median([...photos.map(p => p.lat)].sort((a, b) => a - b));
            const medianLng = median([...photos.map(p => p.lng)].sort((a, b) => a - b));

            const distances = photos.map(p => haversineMeters(p.lat, p.lng, medianLat, medianLng));
            const sortedDistances = [...distances].sort((a, b) => a - b);
            const medianDist = median(sortedDistances);
            const mad = median(sortedDistances.map(d => Math.abs(d - medianDist)).sort((a, b) => a - b));

            // 50m floor keeps a tight, low-variance cluster from having
            // nearly everything flagged once MAD collapses toward zero.
            const threshold = medianDist + Math.max(mad * 3.5, 50);

            const inliers = photos.filter((p, i) => distances[i] <= threshold);
            return inliers.length > 0 ? inliers : photos;
        }

        function updateFileProcessingStatus(successCount, errorCount) {
            if (successCount > 0) {
                elements.status.textContent = `Successfully added ${successCount} photos to the map.`;
                elements['success-message'].textContent = `Added ${successCount} photos to the map.`;

                setTimeout(() => {
                    const placedEntries = state.photoData
                        .map((photo, index) => ({ photo, marker: state.markers[index] }))
                        .filter(entry => entry.marker);

                    if (placedEntries.length > 0) {
                        const inliers = filterPositionOutliers(placedEntries.map(entry => entry.photo));
                        const inlierIds = new Set(inliers.map(p => p.id));
                        const framingMarkers = placedEntries
                            .filter(entry => inlierIds.has(entry.photo.id))
                            .map(entry => entry.marker);

                        // fitBounds first (over inliers only) to get a zoom
                        // level that frames the walk without an outlier
                        // forcing everything to zoom out, then recenter on
                        // the true centroid of that same inlier set.
                        const group = L.featureGroup(framingMarkers);
                        state.map.fitBounds(group.getBounds(), { padding: [50, 50] });
                        const centroid = calculatePhotoCentroid(inliers);
                        if (centroid) {
                            state.map.panTo([centroid.lat, centroid.lng], { animate: false });
                        }
                    }
                }, 500);
            }

            if (errorCount > 0) {
                elements['error-message'].textContent = `${errorCount} photos had no geolocation data.`;
            }
        }

        function convertDMSToDD(dms, ref) {
            const dd = dms[0] + dms[1]/60 + dms[2]/3600;
            return (ref === 'S' || ref === 'W') ? -dd : dd;
        }

        function addPhotoToMap(src, filename, lat, lng) {
            const photo = {
                id: 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                src: src,
                filename: filename,
                lat: lat,
                lng: lng
            };

            const index = state.photoData.length;
            state.photoData.push(photo);

            const img = new Image();
            img.onload = function() {
                const aspectRatio = this.width / this.height;
                const { maxWidth, maxHeight } = getMaxDimensions();
                let markerWidth, markerHeight;

                // Calculate initial dimensions with max size constraints
                const defaultBase = getDefaultMarkerBaseSize();
                if (this.width <= this.height) {
                    markerWidth = Math.min(defaultBase, maxWidth);
                    markerHeight = Math.min(Math.round(defaultBase / aspectRatio), maxHeight);
                    // Recalculate width if height was constrained
                    if (markerHeight < Math.round(defaultBase / aspectRatio)) {
                        markerWidth = Math.round(markerHeight * aspectRatio);
                    }
                } else {
                    markerHeight = Math.min(defaultBase, maxHeight);
                    markerWidth = Math.min(Math.round(defaultBase * aspectRatio), maxWidth);
                    // Recalculate height if width was constrained
                    if (markerWidth < Math.round(defaultBase * aspectRatio)) {
                        markerHeight = Math.round(markerWidth / aspectRatio);
                    }
                }

                const dimensions = calculateMarkerDimensions(markerWidth, markerHeight);
                const customIcon = createMarkerIcon(src, photo.id, dimensions);

                const marker = L.marker([lat, lng], { icon: customIcon }).addTo(state.map);
                state.maxZIndex += 1;
                marker.setZIndexOffset(state.maxZIndex);
                marker._currentZIndex = state.maxZIndex;
                state.markers[index] = marker;

                marker.originalWidth = markerWidth;
                marker.originalHeight = markerHeight;
                marker.aspectRatio = aspectRatio;
                marker.photoSrc = src;
                marker.photoId = photo.id;
                // Add click handler for stroller mode
                if (!CONFIG.IS_MAKER_MODE) {
                    marker.on('click', (e) => {
                        e.originalEvent.stopPropagation();
                        handleMarkerClick(marker, index);
                    });
                }

                refreshPhotoList();
            };
            img.src = src;
        }

        // Marker functions with responsive sizing
        function calculateMarkerDimensions(originalWidth, originalHeight, zoomLevel, isEnlarged = false) {
            // Always square in stroller mode unless enlarged
            if (!CONFIG.IS_MAKER_MODE && !isEnlarged) {
                return { width: CONFIG.SQUARE_SIZE, height: CONFIG.SQUARE_SIZE, mode: 'square' };
            }

            // Get max dimensions based on device and state
            const { maxWidth, maxHeight } = getMaxDimensions(isEnlarged);

            // Original zoom-based behavior for maker mode
            const zoom = zoomLevel || state.map.getZoom();
            const params = getZoomDisplayParams(zoom);

            if (params.mode === 'square' && !isEnlarged) {
                return { width: CONFIG.SQUARE_SIZE, height: CONFIG.SQUARE_SIZE, mode: 'square' };
            } else if (params.mode === 'full' || isEnlarged) {
                let width = originalWidth;
                let height = originalHeight;
                const aspectRatio = width / height;

                if (isEnlarged) {
                    // Fill the target box (grow OR shrink) rather than only
                    // ever shrinking oversized originals — the stored
                    // originalWidth/Height are thumbnail-scale, so without
                    // this an "enlarged" photo could stay tiny.
                    const scale = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);
                } else if (width > maxWidth || height > maxHeight) {
                    if (width / maxWidth > height / maxHeight) {
                        width = maxWidth;
                        height = Math.round(maxWidth / aspectRatio);
                    } else {
                        height = maxHeight;
                        width = Math.round(maxHeight * aspectRatio);
                    }
                }

                return {
                    width: Math.round(width * (params.scale || 1.0)),
                    height: Math.round(height * (params.scale || 1.0)),
                    mode: 'full'
                };
            } else {
                const factor = params.factor;
                let width = Math.round(CONFIG.SQUARE_SIZE + (originalWidth - CONFIG.SQUARE_SIZE) * factor);
                let height = Math.round(CONFIG.SQUARE_SIZE + (originalHeight - CONFIG.SQUARE_SIZE) * factor);

                // Apply constraints during interpolation
                width = Math.min(width, maxWidth);
                height = Math.min(height, maxHeight);

                return { width, height, mode: 'interpolation' };
            }
        }

        function getZoomDisplayParams(zoomLevel) {
            if (zoomLevel <= CONFIG.SQUARE_ZOOM_MAX) {
                return { mode: 'square' };
            } else if (zoomLevel >= CONFIG.FULL_ZOOM_MIN) {
                return { mode: 'full', scale: 1.0 };
            } else {
                const range = CONFIG.FULL_ZOOM_MIN - CONFIG.SQUARE_ZOOM_MAX;
                const progress = zoomLevel - CONFIG.SQUARE_ZOOM_MAX;
                const factor = progress / range;
                return { mode: 'interpolation', factor };
            }
        }

        function createMarkerIcon(photoSrc, photoId, dimensions) {
            const { width, height, mode } = dimensions;
            const totalHeight = height + CONFIG.MARKER_DOT_OFFSET;
            const anchorX = Math.round(width / 2);
            const anchorY = height + CONFIG.MARKER_DOT_OFFSET;

            const objectFit = mode === 'square' ? 'cover' : 'fill';
            const borderRadius = mode === 'square' ? '50%' : '0';
            const deleteBtn = CONFIG.IS_MAKER_MODE ?
                `<div class="delete-button" data-photo-id="${photoId}" title="Remove photo">×</div>` : '';
            const controlPoint = (state.optionKeyDown && CONFIG.IS_MAKER_MODE) ?
                '<div class="control-point" title="Drag to resize"></div>' : '';

            return L.divIcon({
                className: 'custom-marker',
                html: `
                    <div class="marker-container">
                        <img src="${photoSrc}" style="width:${width}px;height:${height}px;object-fit:${objectFit};border-radius:${borderRadius};" />
                        <div class="marker-triangle"></div>
                        <div class="marker-dot"></div>
                        ${deleteBtn}
                        ${controlPoint}
                    </div>
                `,
                iconSize: [width, totalHeight],
                iconAnchor: [anchorX, anchorY]
            });
        }

        function handleZoomChange() {
            const currentZoom = state.map.getZoom();

            state.markers.forEach((marker, index) => {
                if (marker && marker.originalWidth && marker.originalHeight && state.photoData[index]) {
                    const newDimensions = calculateMarkerDimensions(marker.originalWidth, marker.originalHeight);
                    const correctPosition = L.latLng(state.photoData[index].lat, state.photoData[index].lng);

                    updateMarkerIcon(marker, newDimensions, correctPosition);
                }
            });
        }

        function updateMarkerIcon(marker, dimensions, position) {
            const currentZIndex = marker._currentZIndex || marker.options.zIndexOffset;
            const wasOnMap = state.map.hasLayer(marker);

            if (wasOnMap) {
                state.map.removeLayer(marker);
            }

            const customIcon = createMarkerIcon(marker.photoSrc, marker.photoId, dimensions);
            marker.setIcon(customIcon);
            marker.setLatLng(position);

            if (wasOnMap) {
                marker.addTo(state.map);
            }

            if (currentZIndex) {
                marker.setZIndexOffset(currentZIndex);
                marker._currentZIndex = currentZIndex;
            }

            marker.update();
        }

        // Cheap in-place resize during an active drag: mutates the existing
        // marker DOM directly instead of going through Leaflet's setIcon,
        // which tears down and rebuilds the icon (image reload, lost
        // control-point element) on every mousemove.
        function resizeMarkerIconInPlace(marker, dimensions) {
            const icon = marker._icon;
            if (!icon) return;

            const { width, height, mode } = dimensions;
            const totalHeight = height + CONFIG.MARKER_DOT_OFFSET;
            const anchorX = Math.round(width / 2);
            const anchorY = totalHeight;

            const img = icon.querySelector('img');
            if (img) {
                img.style.width = width + 'px';
                img.style.height = height + 'px';
                img.style.objectFit = mode === 'square' ? 'cover' : 'fill';
            }

            icon.style.width = width + 'px';
            icon.style.height = totalHeight + 'px';
            icon.style.marginLeft = (-anchorX) + 'px';
            icon.style.marginTop = (-anchorY) + 'px';
        }

        // UI functions
        function refreshPhotoList() {
            elements['photo-list'].innerHTML = '';

            state.photoData.forEach((photo, index) => {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';

                const thumbnail = document.createElement('img');
                thumbnail.src = photo.src;
                thumbnail.className = 'thumbnail';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'photo-info';

                const photoName = document.createElement('p');
                photoName.textContent = photo.filename;

                const coords = document.createElement('small');
                coords.textContent = `${photo.lat.toFixed(6)}, ${photo.lng.toFixed(6)}`;

                infoDiv.appendChild(photoName);
                infoDiv.appendChild(coords);

                photoItem.appendChild(thumbnail);
                photoItem.appendChild(infoDiv);

                if (CONFIG.IS_MAKER_MODE) {
                    const deleteButton = document.createElement('div');
                    deleteButton.className = 'photo-delete-button';
                    deleteButton.innerHTML = '×';
                    deleteButton.title = 'Remove photo';
                    deleteButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removePhoto(index);
                    });
                    photoItem.appendChild(deleteButton);
                }

                photoItem.addEventListener('click', () => {
                    if (state.markers[index]) {
                        state.map.setView([photo.lat, photo.lng], 16);
                    }
                });

                elements['photo-list'].appendChild(photoItem);
            });
        }

        function removePhoto(index) {
            if (index >= 0 && index < state.photoData.length) {
                if (state.markers[index]) {
                    state.markers[index].off();
                    state.map.removeLayer(state.markers[index]);
                    state.markers[index] = null;
                }

                state.markers.splice(index, 1);
                state.photoData.splice(index, 1);

                refreshPhotoList();
                elements.status.textContent = `Photo removed. ${state.photoData.length} photos remaining.`;
            }
        }

        function fitAllPhotos() {
            const placedEntries = state.photoData
                .map((photo, index) => ({ photo, marker: state.markers[index] }))
                .filter(entry => entry.marker);

            if (placedEntries.length === 0) {
                elements.status.textContent = 'No photos with geolocation data available.';
                return;
            }

            // Same outlier-robust framing as a fresh photo drop: fit to the
            // inlier bounds first (so one bad GPS fix doesn't force the
            // whole view to zoom out), then recenter on the inlier centroid.
            const inliers = filterPositionOutliers(placedEntries.map(entry => entry.photo));
            const inlierIds = new Set(inliers.map(p => p.id));
            const framingMarkers = placedEntries
                .filter(entry => inlierIds.has(entry.photo.id))
                .map(entry => entry.marker);

            const group = L.featureGroup(framingMarkers);
            state.map.fitBounds(group.getBounds(), { padding: [50, 50] });
            const centroid = calculatePhotoCentroid(inliers);
            if (centroid) {
                state.map.panTo([centroid.lat, centroid.lng], { animate: false });
            }

            elements.status.textContent = 'Showing all photos on map.';
        }

        function clearAllData() {
            state.markers.forEach(marker => {
                if (marker) {
                    marker.off();
                    state.map.removeLayer(marker);
                }
            });

            state.markers.length = 0;
            state.photoData.length = 0;
            state.maxZIndex = 1000;
            state.optionKeyDown = false;

            elements['photo-list'].innerHTML = '';
            elements['error-message'].textContent = '';
            elements['success-message'].textContent = '';

            state.map.setView(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM, { animate: false });
        }

        // Wipes the whole gallery, not just the photos: name and slug reset
        // too, so this is a genuine "start a new walk" rather than "Show All
        // Photos"'s sibling. Confirms first since there's no undo.
        function clearGallery() {
            if (state.photoData.length > 0 &&
                !confirm('Clear all photos and reset the gallery name/slug? This cannot be undone.')) {
                return;
            }

            clearAllData();
            state.walkName = '';
            state.walkSlug = '';
            state.walkSlugManuallySet = false;
            updateTitleDisplay();
        }

        // Save/Load functions.
        //
        // Exports a zip containing a lean walk.json (photo metadata + relative
        // paths, no embedded image data) plus a photos/ folder of real image
        // files. Unzip the result into walks/<slug>/ and add an entry to
        // walks.json. Photos that were loaded from an existing lean walk.json
        // (carrying a `photo` relative path instead of inline `src` data)
        // are passed through without being re-encoded.
        function slugify(text) {
            return (text || '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        async function saveState() {
            if (state.photoData.length === 0) {
                elements.status.textContent = 'No photos to save.';
                return;
            }

            elements.status.textContent = 'Preparing export...';

            const slug = state.walkSlug || currentWalk?.slug || slugify(state.walkName) || `walk-${Date.now()}`;
            state.walkSlug = slug;
            const jsonFilename = `${slug}.json`;
            const dataFile = `walks/${slug}/${jsonFilename}`;

            const zip = new JSZip();
            const photosFolder = zip.folder('photos');
            const usedNames = new Set();

            const leanPhotos = state.photoData.map((photo, index) => {
                const marker = state.markers[index];
                const dataUrlMatch = /^data:([^;]+);base64,(.*)$/.exec(photo.src || '');
                let relPath = photo.photo || null;

                if (dataUrlMatch) {
                    const mime = dataUrlMatch[1];
                    const ext = mime === 'image/png' ? 'png' : 'jpg';
                    const base = (photo.filename || photo.id).replace(/\.[^.]+$/, '');
                    let name = `${base}.${ext}`;
                    let n = 1;
                    while (usedNames.has(name)) {
                        name = `${base}_${n++}.${ext}`;
                    }
                    usedNames.add(name);
                    photosFolder.file(name, dataUrlMatch[2], { base64: true });
                    relPath = `photos/${name}`;
                }

                return {
                    id: photo.id,
                    photo: relPath,
                    filename: photo.filename,
                    lat: photo.lat,
                    lng: photo.lng,
                    originalWidth: marker?.originalWidth,
                    originalHeight: marker?.originalHeight
                };
            });

            const walkData = {
                slug: slug,
                title: state.walkName || '',
                photos: leanPhotos,
                mapCenter: state.map.getCenter(),
                mapZoom: state.map.getZoom(),
                version: '2.0',
                savedAt: new Date().toISOString()
            };

            zip.file(jsonFilename, JSON.stringify(walkData, null, 2));

            // Upsert this walk's entry into the manifest and bundle the
            // updated walks.json in the same download, so saving doesn't
            // require a separate manual edit to register/update the walk.
            let manifest = [];
            try {
                const res = await fetch('walks.json', { cache: 'no-store' });
                if (res.ok) manifest = await res.json();
            } catch (error) {
                console.warn('Could not load existing walks.json, starting a new manifest.', error);
            }

            const entry = { slug, title: state.walkName || slug, dataFile };
            const existingIndex = manifest.findIndex(w => w.slug === slug);
            if (existingIndex >= 0) {
                manifest[existingIndex] = entry;
            } else {
                manifest.push(entry);
            }

            zip.file('walks.json', JSON.stringify(manifest, null, 2));

            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = slug + '.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            elements.status.textContent = `Exported. Unzip into walks/${slug}/, and replace the project's walks.json with the one included in the download.`;
        }

        function loadState(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const saveData = JSON.parse(e.target.result);
                    loadStateFromData(saveData);
                } catch (error) {
                    console.error('Error loading state:', error);
                    elements['error-message'].textContent = 'Failed to load state. The file might be corrupted.';
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function loadStateFromData(saveData) {
            if (!saveData.photos || !Array.isArray(saveData.photos)) {
                throw new Error('Invalid save file format');
            }

            clearAllData();

            if (saveData.title) {
                state.walkName = saveData.title;
                updateTitleDisplay();
            }

            if (saveData.slug) {
                state.walkSlug = saveData.slug;
                state.walkSlugManuallySet = true;
                updateTitleDisplay();
            }

            if (saveData.mapCenter && saveData.mapZoom) {
                state.map.setView([saveData.mapCenter.lat, saveData.mapCenter.lng], saveData.mapZoom);
            }

            saveData.photos.forEach(photo => {
                addSavedPhotoToMap({
                    id: photo.id,
                    src: resolvePhotoSrc(photo),
                    photo: photo.photo,
                    filename: photo.filename,
                    lat: photo.lat,
                    lng: photo.lng,
                    originalWidth: photo.originalWidth,
                    originalHeight: photo.originalHeight
                });
            });

            elements.status.textContent = 'Data loaded successfully.';
        }

        function addSavedPhotoToMap(photo) {
            if (!photo.id) {
                photo.id = 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            const index = state.photoData.length;
            state.photoData.push(photo);

            const img = new Image();
            img.onload = function() {
                const aspectRatio = this.width / this.height;
                const { maxWidth, maxHeight } = getMaxDimensions();
                let markerWidth, markerHeight;

                if (photo.originalWidth && photo.originalHeight) {
                    // Use saved dimensions but apply constraints
                    markerWidth = Math.min(photo.originalWidth, maxWidth);
                    markerHeight = Math.min(photo.originalHeight, maxHeight);

                    // Maintain aspect ratio if constrained
                    if (markerWidth < photo.originalWidth || markerHeight < photo.originalHeight) {
                        if (markerWidth / photo.originalWidth < markerHeight / photo.originalHeight) {
                            markerHeight = Math.round(markerWidth / aspectRatio);
                        } else {
                            markerWidth = Math.round(markerHeight * aspectRatio);
                        }
                    }
                } else {
                    // Calculate with constraints
                    const defaultBase = getDefaultMarkerBaseSize();
                    if (this.width <= this.height) {
                        markerWidth = Math.min(defaultBase, maxWidth);
                        markerHeight = Math.min(Math.round(defaultBase / aspectRatio), maxHeight);
                        if (markerHeight < Math.round(defaultBase / aspectRatio)) {
                            markerWidth = Math.round(markerHeight * aspectRatio);
                        }
                    } else {
                        markerHeight = Math.min(defaultBase, maxHeight);
                        markerWidth = Math.min(Math.round(defaultBase * aspectRatio), maxWidth);
                        if (markerWidth < Math.round(defaultBase * aspectRatio)) {
                            markerHeight = Math.round(markerWidth / aspectRatio);
                        }
                    }
                }

                const dimensions = calculateMarkerDimensions(markerWidth, markerHeight);
                const customIcon = createMarkerIcon(photo.src, photo.id, dimensions);

                const marker = L.marker([photo.lat, photo.lng], { icon: customIcon }).addTo(state.map);
                state.maxZIndex += 1;
                marker.setZIndexOffset(state.maxZIndex);
                marker._currentZIndex = state.maxZIndex;
                state.markers[index] = marker;

                marker.originalWidth = markerWidth;
                marker.originalHeight = markerHeight;
                marker.aspectRatio = aspectRatio;
                marker.photoSrc = photo.src;
                marker.photoId = photo.id;
                // Add click handler for stroller mode
                if (!CONFIG.IS_MAKER_MODE) {
                    marker.on('click', (e) => {
                        e.originalEvent.stopPropagation();
                        handleMarkerClick(marker, index);
                    });
                }

                refreshPhotoList();
            };
            img.src = photo.src;
        }

        // Interaction functions
        function showControlPoints() {
            state.markers.forEach(marker => {
                if (marker?._icon) {
                    const container = marker._icon.querySelector('.marker-container');
                    if (container && !container.querySelector('.control-point')) {
                        const controlPoint = document.createElement('div');
                        controlPoint.className = 'control-point';
                        controlPoint.title = 'Drag to resize';
                        container.appendChild(controlPoint);
                    }
                }
            });
        }

        function hideControlPoints() {
            state.markers.forEach(marker => {
                if (marker?._icon) {
                    const controlPoint = marker._icon.querySelector('.control-point');
                    if (controlPoint) {
                        controlPoint.remove();
                    }
                }
            });
        }

        function startResize(e, marker) {
            state.isDragging = true;
            bringMarkerToFront(marker);

            const img = marker._icon?.querySelector('img');
            const currentDimensions = calculateMarkerDimensions(marker.originalWidth, marker.originalHeight);

            state.dragState = {
                marker: marker,
                startX: e.clientX,
                startY: e.clientY,
                startWidth: img ? parseInt(img.style.width) : currentDimensions.width,
                startHeight: img ? parseInt(img.style.height) : currentDimensions.height,
                originalWidth: marker.originalWidth,
                originalHeight: marker.originalHeight,
                aspectRatio: marker.aspectRatio,
                photoSrc: marker.photoSrc,
                photoId: marker.photoId
            };

            document.addEventListener('mousemove', handleResize);
            document.addEventListener('mouseup', stopResize);
        }

        function handleResize(e) {
            if (!state.isDragging || !state.dragState) return;

            const deltaX = e.clientX - state.dragState.startX;
            const deltaY = e.clientY - state.dragState.startY;
            // Control point sits at the top-left corner; moving it away from
            // the image (up-left, both deltas negative) should grow the
            // image, moving toward it (down-right) should shrink it. Average
            // the two axes rather than taking their min, so a drag that's
            // mostly horizontal or mostly vertical still resizes smoothly.
            const scaleDelta = (deltaX + deltaY) / 2;
            const scaleMultiplier = Math.max(0.2, 1 - (scaleDelta / 100));

            const { maxWidth, maxHeight } = getMaxDimensions();

            let newOriginalWidth = Math.round(state.dragState.originalWidth * scaleMultiplier);
            let newOriginalHeight = Math.round(state.dragState.originalHeight * scaleMultiplier);

            // Apply constraints
            if (newOriginalWidth > maxWidth || newOriginalHeight > maxHeight) {
                const aspectRatio = state.dragState.aspectRatio;
                if (newOriginalWidth / maxWidth > newOriginalHeight / maxHeight) {
                    newOriginalWidth = maxWidth;
                    newOriginalHeight = Math.round(maxWidth / aspectRatio);
                } else {
                    newOriginalHeight = maxHeight;
                    newOriginalWidth = Math.round(maxHeight * aspectRatio);
                }
            }

            state.dragState.marker.originalWidth = newOriginalWidth;
            state.dragState.marker.originalHeight = newOriginalHeight;

            const dimensions = calculateMarkerDimensions(newOriginalWidth, newOriginalHeight);
            resizeMarkerIconInPlace(state.dragState.marker, dimensions);
        }

        function stopResize() {
            document.removeEventListener('mousemove', handleResize);
            document.removeEventListener('mouseup', stopResize);

            if (state.dragState) {
                const marker = state.dragState.marker;
                const dimensions = calculateMarkerDimensions(marker.originalWidth, marker.originalHeight);
                const photoIndex = state.photoData.findIndex(p => p.id === state.dragState.photoId);
                const position = photoIndex >= 0 ?
                    L.latLng(state.photoData[photoIndex].lat, state.photoData[photoIndex].lng) :
                    marker.getLatLng();
                updateMarkerIcon(marker, dimensions, position);
            }

            state.isDragging = false;
            state.dragState = null;
        }

        function startMarkerDrag(e, marker, photoIndex) {
            e.preventDefault();
            e.stopPropagation();

            bringMarkerToFront(marker);

            const startX = e.clientX;
            const startY = e.clientY;
            let hasMoved = false;
            const dragThreshold = 5;

            // Offset (in map pixel space) between the mouse and the marker's
            // anchor point, so the grabbed spot on the photo stays under the
            // cursor instead of the photo's base snapping to the cursor.
            const mapRect = document.getElementById('map').getBoundingClientRect();
            const anchorContainerPoint = state.map.latLngToContainerPoint(marker.getLatLng());
            const mouseContainerPoint = L.point(startX - mapRect.left, startY - mapRect.top);
            const grabOffset = mouseContainerPoint.subtract(anchorContainerPoint);

            const tempDragState = {
                marker: marker,
                photoIndex: photoIndex,
                startMousePos: { x: startX, y: startY },
                startLatLng: marker.getLatLng(),
                grabOffset: grabOffset
            };

            const tempMouseMove = (moveEvent) => {
                const deltaX = Math.abs(moveEvent.clientX - startX);
                const deltaY = Math.abs(moveEvent.clientY - startY);

                if (!hasMoved && (deltaX > dragThreshold || deltaY > dragThreshold)) {
                    hasMoved = true;
                    state.isMarkerDragging = true;
                    state.markerDragState = tempDragState;
                    state.map.dragging.disable();

                    document.removeEventListener('mousemove', tempMouseMove);
                    document.removeEventListener('mouseup', tempMouseUp);
                    document.addEventListener('mousemove', handleMarkerDrag);
                    document.addEventListener('mouseup', stopMarkerDrag);
                }
            };

            const tempMouseUp = () => {
                document.removeEventListener('mousemove', tempMouseMove);
                document.removeEventListener('mouseup', tempMouseUp);
            };

            document.addEventListener('mousemove', tempMouseMove);
            document.addEventListener('mouseup', tempMouseUp);
        }

        function handleMarkerDrag(e) {
            if (!state.isMarkerDragging || !state.markerDragState) return;

            const mapRect = document.getElementById('map').getBoundingClientRect();
            const mouseContainerPoint = L.point(e.clientX - mapRect.left, e.clientY - mapRect.top);
            const anchorContainerPoint = mouseContainerPoint.subtract(state.markerDragState.grabOffset);
            const newLatLng = state.map.containerPointToLatLng(anchorContainerPoint);

            state.markerDragState.marker.setLatLng(newLatLng);
        }

        function stopMarkerDrag() {
            if (!state.isMarkerDragging || !state.markerDragState) return;

            state.isMarkerDragging = false;

            const newLatLng = state.markerDragState.marker.getLatLng();
            if (state.markerDragState.photoIndex >= 0 && state.markerDragState.photoIndex < state.photoData.length) {
                state.photoData[state.markerDragState.photoIndex].lat = newLatLng.lat;
                state.photoData[state.markerDragState.photoIndex].lng = newLatLng.lng;
                refreshPhotoList();
            }

            state.map.dragging.enable();
            document.removeEventListener('mousemove', handleMarkerDrag);
            document.removeEventListener('mouseup', stopMarkerDrag);

            elements.status.textContent = `Photo moved to ${newLatLng.lat.toFixed(6)}, ${newLatLng.lng.toFixed(6)}.`;
            state.markerDragState = null;
        }

        function bringMarkerToFront(marker) {
            state.maxZIndex += 1;
            marker.setZIndexOffset(state.maxZIndex);
            marker._currentZIndex = state.maxZIndex;
        }

        // Make functions available globally for external access
        window.loadStateFromData = loadStateFromData;
        window.clearAllData = clearAllData;

        function handleMarkerClick(marker, index) {
            // If clicking the already enlarged marker, just reset it
            if (state.enlargedMarker === marker) {
                resetEnlargedMarker();
                return;
            }

            // Reset any previously enlarged marker
            if (state.enlargedMarker) {
                resetEnlargedMarker();
            }

            // Enlarge this marker
            state.enlargedMarker = marker;
            bringMarkerToFront(marker);

            // Get full dimensions with enlarged constraints
            const fullDimensions = calculateMarkerDimensions(
                marker.originalWidth,
                marker.originalHeight,
                null,
                true // isEnlarged = true
            );

            const position = L.latLng(state.photoData[index].lat, state.photoData[index].lng);
            updateMarkerIcon(marker, fullDimensions, position);

            // Auto-collapse back to the circle once the mouse leaves the
            // enlarged photo. Native 'mouseleave' (not Leaflet's marker
            // 'mouseout', which bubbles from internal children like the
            // <img> and would fire the instant the cursor crosses onto the
            // photo itself) only fires on a genuine exit of the icon's
            // bounds, and {once:true} keeps this from piling up listeners
            // across repeated enlarge/collapse cycles.
            if (marker._icon) {
                marker._icon.addEventListener('mouseleave', () => {
                    if (state.enlargedMarker === marker) {
                        resetEnlargedMarker();
                    }
                }, { once: true });
            }
        }

        function resetEnlargedMarker() {
            if (!state.enlargedMarker) return;

            // Find the index of the enlarged marker
            const index = state.markers.indexOf(state.enlargedMarker);
            if (index >= 0) {
                const squareDimensions = {
                    width: CONFIG.SQUARE_SIZE,
                    height: CONFIG.SQUARE_SIZE,
                    mode: 'square'
                };
                const position = L.latLng(state.photoData[index].lat, state.photoData[index].lng);
                updateMarkerIcon(state.enlargedMarker, squareDimensions, position);
            }

            state.enlargedMarker = null;
        }

    </script>
</body>
</html>
